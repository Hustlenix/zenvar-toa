# DealSprint-style static deploy for the Zenvar Team Operating Agreement (TOA).
# Deploys the static site to GitHub Pages on every push to `main`, and via
# manual dispatch. Uses the official Pages deploy actions.
#
# Publishing source on the repo must be set to "GitHub Actions" (done once via
# the repo Settings > Pages, or the API). This workflow then owns the deploy.

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
